const C = {"name": "Rhianieee", "title": "To the most gorgeous woman", "question": "Can you be my girlfriend na po? 🙁", "thanks": "Thank you so much, Rhianieee! You made me so happy. 💗", "songs": [{"title": "Libu-libong Buwan", "artist": "Kyle Raphael", "link": "https://www.youtube.com/results?search_query=Libu-libong+Buwan+Kyle+Raphael"}, {"title": "Lego House", "artist": "Ed Sheeran", "link": "https://www.youtube.com/results?search_query=Lego+House+Ed+Sheeran"}], "flowers": [["🌹", "White Roses", "Pure, honest love: you’re someone I want to love with genuine intentions.", "grayscale(1) brightness(1.7)"], ["🌺", "Pink Lilies", "Tender, graceful love: the soft way you make my heart feel.", ""], ["🌻", "Sunflower", "Loyal, warm love: you’re the sunshine that brightens my ordinary days.", ""], ["🌼", "Daisy", "Gentle, sincere love: simple moments with you feel the most special.", ""], ["🌷", "Pink Tulips", "Caring love: I want to care for you in the little ways, every day.", ""]], "letter": ["hi, beybi, beb, riyan, yan, ri, rhianiee, AHAHAHAHAHA, idk where to start ani pero i just want you to know how thankful i am nga nakaila ko nimo. funny kaayo hunahunaon nga we started talking tungod ra sa technical things, then look at us now. from random talks, mga walay pulos nga ideas, teasing each other, rage baiting, and sharing little things about our days, slowly, nahimo kang someone nga i genuinely want to know more and more.", "one thing i love about you is how you can make me laugh even sa mga times nga wala kaayo koy gana. i love how you can be yourself around me, how you tell me things, and how you let me see the side of you nga dili siguro makita sa tanan. i know nga most of the time, ikaw ang naanad nga mag-lead, but you once told me nga “you lead, i will follow.” and honestly, that means something to me. i want you to feel nga you don’t always have to be the strong one. you can rest, you can be soft, and you can let someone care for you, too.", "and riya, i hope you know nga dili lang imong pretty face ang akong gi-appreciate sa imoha. yes, you’re beautiful, and i hope one day makita nimo imong self the way i see you. pero more than that, i appreciate your heart, your personality, your little reactions, your pagka-pababy, even those little things nga basin para sa imoha ordinaryo ra. you don’t have to compare yourself to anyone just to feel like you’re enough. you don’t have to compete for attention or prove nga you’re worth choosing. i want you to feel appreciated for being you, not because you have to be prettier, better, or more than someone else.", "i also know nga there are times nga you overthink, especially when it comes to my past or when you see things that make you uncomfortable. i understand nga dili enough ang words alone to make those worries disappear. and i’m sorry for the times nga i’ve made you feel like you had to ask for my attention, remind me of my promises, or wonder where you stand in my life. i’m still learning how to love and understand you better, and i know nga dili tanan ma-fix sa usa ka sorry or sa usa ka long message.", "that’s why i want to show you through my actions, too. i want to be more mindful sa akong actions, especially when we’re around other people. i want to notice you, approach you, and make you feel nga i’m not only there for you when it’s just the two of us. you deserve consistency, riya. you deserve someone nga dili lang sweet sa chat but can also make you feel valued in person. and i want to become someone who can give you that kind of reassurance.", "i’m not saying nga i’ll be perfect, kay kabalo ko nga naa pa koy daghan dapat makat-onan. but my intentions for you are genuine. when i told you nga i wanted to pursue you, i meant it. dili tika gi-pursue just because i enjoy the attention or because i need someone to fill a space in my life. i want to know you deeper, understand the things that make you happy or uncomfortable, learn how to handle our misunderstandings better, and discover more about you as time goes by.", "i love how familiar you can feel even though we haven’t known each other for that long. i love our random conversations, our little jokes, and the way we can make ordinary moments feel special. and if there’s one thing i want you to remember, it’s that you don’t have to be perfect around me. you don’t always have to act okay, and you don’t have to hide what you feel just because you’re afraid nga basin OA ra ka. your feelings matter, too, and i want us to learn how to understand each other instead of making each other feel alone.", "i can’t promise nga walay misunderstandings or bad days, but i can promise nga i’ll do my best to communicate, listen, and make things right when i know i’ve hurt you. i don’t want you to hold on to my words alone. i want you to see the difference through the way i treat you, the way i respect you, and the way i continue showing up for you.", "thank you for letting me get closer to you, riya. thank you for making me laugh, for sharing your little world with me, and for giving me the chance to pursue you. i’m happy nga ikaw akong nakaila, and i’m looking forward to knowing more sides of you nga wala pa nako nakita.", "so please, don’t forget to appreciate yourself, too, okay? i hope someday, ma-appreciate nimo imong beauty the same way i appreciate it, and your heart the same way i value it. you don’t need to earn your place by being perfect. you are someone worth knowing, understanding, and choosing with genuine intentions.", "i don’t know exactly where this journey will take us, but i know nga i want to take my time knowing you and doing things right. no rushing, no empty promises, just genuine intentions and effort nga makita nimo, not just words nga mabasa nimo.", "i’m really glad it’s you, rhiane. and as long as you allow me to pursue you, i’ll keep learning how to treat your heart with the care and respect it deserves.", "always remember nga you’re appreciated, you’re seen, and you’re someone i’ const $ = s => document.querySelector(s);
const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
document.querySelectorAll('.stick').forEach(i => i.src = C.sticker);
$('#t0').textContent = C.title; $('#t1').textContent = C.title; $('#nm').textContent = C.name;
$('#q').textContent = C.question; $('#ty').textContent = C.thanks;
C.letter.forEach(t => $('#lt').appendChild(el('p', t)));
C.songs.forEach(s => {
  const d = document.createElement('div'); d.className = 'song';
  const l = document.createElement('div'); l.appendChild(el('b', s.title)); l.appendChild(el('span', s.artist));
  const a = el('a', '▶ Listen', 'btn'); a.href = s.link; a.target = '_blank'; a.rel = 'noopener';
  d.appendChild(l); d.appendChild(a); $('#sl').appendChild(d);
});
const seen = new Set(), picks = ['flowers', 'letter', 'songs'];
function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === id));
  if (picks.includes(id)) seen.add(id);
  if (id === 'hub'){ picks.forEach(k => $('#h-' + k).classList.toggle('done', seen.has(k)));
    $('#hubnext').hidden = seen.size < 3; $('#hubtip').textContent = seen.size < 3 ? 'Pick one 💗' : 'Ready for the last part?'; }
  if (id === 'yes-page') hearts();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) show(b.dataset.go); });
let fi = 0;
function flower(){ const f = C.flowers[fi]; const e = $('#fl'); e.textContent = f[0]; e.style.filter = f[3] || 'none';
  $('#fn').textContent = f[1]; $('#fm').textContent = f[2]; $('#fnext').textContent = fi === C.flowers.length - 1 ? 'Done' : 'Next flower'; }
$('#fnext').onclick = () => { if (fi === C.flowers.length - 1){ fi = 0; flower(); show('hub'); } else { fi++; flower(); } };
$('#fprev').onclick = () => { if (fi === 0) show('hub'); else { fi--; flower(); } };
flower();
const teases = ["Are you sure? 🥺","Think again…","Pretty please?","That button is shy!","Just say yes 💗"]; let t = 0;
function dodge(){ const box = $('#choices').getBoundingClientRect(), b = $('#no');
  b.style.right = 'auto'; b.style.left = Math.random() * (box.width - b.offsetWidth) + 'px'; b.style.top = Math.random() * (box.height - b.offsetHeight) + 'px';
  $('#hint').textContent = teases[t++ % teases.length]; }
$('#no').addEventListener('mouseenter', dodge); $('#no').addEventListener('click', dodge);
$('#no').addEventListener('touchstart', e => { e.preventDefault(); dodge(); }, {passive:false});
$('#yes').onclick = () => show('yes-page');
function hearts(){ for (let i = 0; i < 26; i++){ const h = el('div', ['💗','💖','🎀','🌷'][i % 4], 'heart');
  h.style.left = Math.random() * 100 + 'vw'; h.style.fontSize = 18 + Math.random() * 26 + 'px'; h.style.animationDelay = Math.random() * 1.5 + 's';
  document.body.appendChild(h); setTimeout(() => h.remove(), 6000); } }
</script></body></html>
